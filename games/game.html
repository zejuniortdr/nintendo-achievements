<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Game Details</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-content">
      <a href="../index.html" class="site-logo">Nintendo Achievements</a>
      <nav class="main-nav">
        <a href="../index.html">Home</a>
        <a href="index.html">Games</a>
      </nav>
    </div>
  </header>

  <main class="container game-two-column-layout">
    <div class="game-main-content">
      <div>
        <h1 id="game-title"></h1>
        <p id="game-meta"></p>
        <div class="progress-bar">
          <div id="progress-fill" class="progress-bar-fill"></div>
        </div>
        <p id="progress-text"></p>
      </div>

      <div id="game-container"></div>
    </div>

    <aside class="game-sidebar-right">
      <div class="game-cover-lg">
        <img id="game-cover" alt="Game Cover" class="game-cover-img">
      </div>
    </aside>
  </main>

  <script src="../assets/js/markdown.js"></script>
  <script src="../assets/js/progress-core.js"></script>
  <script src="../assets/js/main.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    loadGameById(params.get("id"));
  </script>

</body>
</html>
