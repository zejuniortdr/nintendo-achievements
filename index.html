<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nintendo Achievements</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-content">
      <a href="index.html" class="site-logo">Nintendo Achievements</a>
      <nav class="main-nav">
        <a href="index.html" class="active">Home</a>
        <a href="games/index.html">Games</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="profile-section" id="profile-section">
      <div class="profile-card bevel-panel">
        <img id="profile-avatar" class="profile-avatar" alt="Profile avatar">
        <div class="profile-info">
          <h1 id="profile-gamertag">...</h1>
          <p class="profile-tagline">Nintendo completionist</p>
        </div>
        <div class="profile-stats">
          <div class="stat">
            <span class="stat-value" id="stat-games">0</span>
            <span class="stat-label">Jogos</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="stat-achievements">0</span>
            <span class="stat-label">Conquistas</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="stat-percent">0%</span>
            <span class="stat-label">Completude geral</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="stat-completed">0</span>
            <span class="stat-label">Jogos 100%</span>
          </div>
        </div>
      </div>
      <div id="badge-list" class="badge-list"></div>
    </section>

    <h1>Game Library</h1>

    <div id="game-list"></div>
  </main>

  <script src="assets/js/markdown.js"></script>
  <script src="assets/js/progress-core.js"></script>
  <script src="assets/js/badges.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
